name: Python quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.30
      - run: uv sync --locked --extra dev
      - run: uv run pytest -ra
      - run: uv run ruff check .
      - run: uv run python -m astra_pcb.cli validate examples/minimal-board/design-spec.yaml
