name: Reviewer OS isolation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap libseccomp2
      - run: python -m pip install uv==0.11.30
      - run: uv sync --locked --extra dev
      - run: uv run pytest tests/test_sandbox.py -ra
