# Trusted harness role policy. No model API call is made by loading this file.
roles:
  - name: architect
    model: gpt-6-astra
    reasoning: high
    tools: [snapshot.read, snapshot.objects]
    shell: false
    source_mount: none
  - name: designer
    model: gpt-6-astra
    reasoning: high
    tools: [board.open, board.read, board.route, board.save, backend.read]
    shell: false
    source_mount: read-write
  - name: reviewer
    model: gpt-6-astra
    reasoning: high
    tools: [snapshot.read, snapshot.objects]
    shell: false
    source_mount: none
  - name: release-gate
    model: null
    reasoning: none
    tools: [checks.execute, artifacts.write]
    shell: false
    source_mount: read-only
