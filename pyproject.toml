[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
[project]
name = "astra-pcb"
version = "0.1.0"
description = "Evidence-driven agentic PCB engineering foundation"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "jsonschema>=4.23,<5",
    "cryptography>=50,<51",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
science = ["numpy>=2,<3", "scipy>=1.14,<2"]
[project.scripts]
astra-pcb = "astra_pcb.cli:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires external engineering tools"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
